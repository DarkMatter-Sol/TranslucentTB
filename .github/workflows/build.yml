name: Build TranslucentTB

on:
  workflow_dispatch:
  push:
    branches: [release, develop]

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "7.0.1"

      - name: Integrate vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Restore
        run: nuget restore TranslucentTB.slnx -NonInteractive

      - name: Build
        run: >
          msbuild TranslucentTB/TranslucentTB.vcxproj /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:BuildType=Dev

      # Fixed: Gathers the binary layers and flattens them into one target release directory
      - name: Stage Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\Staging
          Copy-Item -Path "TranslucentTB\x64\Release\TranslucentTB.exe" -Destination .\Staging\
          Copy-Item -Path "ExplorerHooks\x64\Release\ExplorerHooks.dll" -Destination .\Staging\
          Copy-Item -Path "ProgramLog\x64\Release\ProgramLog.dll" -Destination .\Staging\
          Copy-Item -Path "ExplorerTAP\x64\Release\ExplorerTAP.dll" -Destination .\Staging\

      # Fixed: Uploads the clean folder so it is plug-and-play as soon as you unzip it
      - uses: actions/upload-artifact@v4
        with:
          name: TranslucentTB-Portable-x64
          path: .\Staging\
          if-no-files-found: error
