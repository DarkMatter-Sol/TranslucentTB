name: Build TranslucentTB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Git Submodules
        run: |
          git submodule init
          git submodule update --init --recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Fixed: Use MSBuild's native restore tool targeted directly at the core app config file
      - name: Restore NuGet Packages
        run: |
          msbuild TranslucentTB/TranslucentTB.vcxproj /t:Restore

      - name: Integrate Vcpkg Packages
        run: |
          vcpkg integrate install

      - name: Build Executable Project
        run: |
          msbuild TranslucentTB/TranslucentTB.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Finished Binaries
        uses: actions/upload-artifact@v4
        with:
          name: TranslucentTB-Output
          path: |
            **/x64/Release/TranslucentTB.exe
            **/x64/Release/*.dll
