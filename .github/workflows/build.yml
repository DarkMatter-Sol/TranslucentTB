name: Build TranslucentTB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Integrate Vcpkg
        run: |
          vcpkg integrate install

      - name: Build TranslucentTB
        run: |
          msbuild TranslucentTB/TranslucentTB.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslucentTB-Artifacts
          path: |
            **/x64/Release/TranslucentTB.exe
            **/x64/Release/*.dll
