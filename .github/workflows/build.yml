name: Build TranslucentTB

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Git Submodules
        run: |
          git submodule init
          git submodule update --init --recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Fixed: Setup NuGet CLI tool inside the runner
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      # Fixed: Explicitly restore missing NuGet packages for all sub-projects
      - name: Restore NuGet Packages
        run: |
          nuget restore TranslucentTB.sln

      - name: Integrate Vcpkg Packages
        run: |
          vcpkg integrate install

      # Now it can build safely without throwing missing reference errors
      - name: Build Executable Project
        run: |
          msbuild TranslucentTB/TranslucentTB.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload Finished Binaries
        uses: actions/upload-artifact@v4
        with:
          name: TranslucentTB-Output
          path: |
            **/x64/Release/TranslucentTB.exe
            **/x64/Release/*.dll
