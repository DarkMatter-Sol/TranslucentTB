name: Build TranslucentTB

on:
  workflow_dispatch:
  push:
    branches: [release, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "7.0.1"

      - name: Integrate vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Restore
        run: nuget restore TranslucentTB.slnx -NonInteractive

      - name: Build
        run: >
          msbuild TranslucentTB.slnx
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:BuildType=Dev

      - name: Stage Portable Package
        shell: pwsh
        run: |
          $src = "AppPackage\bin\x64\Release"
          if (-not (Test-Path $src)) { throw "AppPackage output missing: $src" }
          New-Item -ItemType Directory -Force -Path .\Staging | Out-Null
          Copy-Item "$src\*" .\Staging\ -Recurse -Include *.exe,*.dll,resources.pri,Assets
          Get-ChildItem .\Staging -Recurse | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: TranslucentTB-Portable-x64
          path: .\Staging\
          if-no-files-found: error
