name: Build TranslucentTB

"on":
  workflow_dispatch:
  push:
    branches: [release, develop]

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - name: Set vcpkg environment
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Build
        run: >
          msbuild TranslucentTB\TranslucentTB.vcxproj /m /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:BuildType=Dev

      - name: List build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.exe,*.dll -Path TranslucentTB, ExplorerHooks, ProgramLog, ExplorerTAP |
            Select-Object FullName

      - name: Stage Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\Staging

          $targets = @(
            "TranslucentTB\x64\Release\TranslucentTB.exe",
            "ExplorerHooks\x64\Release\ExplorerHooks.dll",
            "ProgramLog\x64\Release\ProgramLog.dll",
            "ExplorerTAP\x64\Release\ExplorerTAP.dll"
          )
          foreach ($t in $targets) {
            if (-not (Test-Path $t)) { Write-Error "Missing build output: $t" }
            Copy-Item $t -Destination .\Staging\
          }

          $runtimeDlls = @(
            "Microsoft.UI.Xaml.dll",
            "Microsoft.UI.Xaml.Controls.dll",
            "Microsoft.UI.Xaml.Controls.pri",
            "Microsoft.Windows.AppLifecycle.dll",
            "Microsoft.Windows.AppNotifications.dll",
            "Microsoft.Internal.FrameworkUdk.dll"
          )

          $candidates = Get-ChildItem -Path "packages" -Recurse -Include *.dll,*.pri |
            Where-Object { $runtimeDlls -contains $_.Name }

          if (-not $candidates) {
            Write-Warning "No XAML runtime DLLs found in packages/ - check package restore"
          }

          $candidates | ForEach-Object {
            Write-Host "Staging runtime: $($_.FullName)"
            Copy-Item $_.FullName -Destination .\Staging\ -Force
          }

          Write-Host "`n=== Final staging contents ==="
          Get-ChildItem .\Staging | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: TranslucentTB-Portable-x64
          path: .\Staging\
          if-no-files-found: error
