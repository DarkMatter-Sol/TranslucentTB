name: Build TranslucentTB

on:
  workflow_dispatch:
  push:
    branches: [release, develop]

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: "7.0.1"

      - name: Integrate vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Restore
        run: nuget restore TranslucentTB.slnx -NonInteractive

      - name: Build
        run: >
          msbuild TranslucentTB/TranslucentTB.vcxproj /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:BuildType=Dev

      # Fixed: Uses recursive search patterns to find and upload the compiled app binaries flawlessly
      - uses: actions/upload-artifact@v4
        with:
          name: TranslucentTB-x64-Release
          path: |
            **/Release/TranslucentTB.exe
            **/Release/*.dll
          if-no-files-found: error
